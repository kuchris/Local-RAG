# Paths
pdf_dir: "data/raw_pdfs"
processed_dir: "data/processed"
vector_db_dir: "data/vectordb"

# MinerU settings
mineru_backend: ""  # Backend for processing (vlm-transformers for best quality, "" for auto-detection)
mineru_output_dir: "data/mineru_output"

# Chunking
chunk_size: 1000
chunk_overlap: 200

# Embeddings
embedding_model: "all-MiniLM-L6-v2"  # Or "all-mpnet-base-v2" for better quality

# Vector store
vector_store_type: "faiss"  # Can be "annoy" or "faiss"

# Annoy settings (only used if vector_store_type is "annoy")
n_neighbors: 5
n_trees: 10

# FAISS settings (only used if vector_store_type is "faiss")
faiss_index_type: "Flat"  # Or "IVF" for large scale
n_neighbors: 5

# Device
device: "cuda"  # GPU processing ("cuda" or "cpu")

# LM Studio
lm_studio_host: "http://127.0.0.1:1234"
max_tokens: 1000
temperature: 0.7